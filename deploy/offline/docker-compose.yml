services:
  certgen:
    image: alpine:3.20
    profiles:
      - certgen
    environment:
      CERT_COUNTRY: ${CERT_COUNTRY:-US}
      CERT_DOMAIN: ${ROCKETCHAT_DOMAIN}
      CERT_DAYS: ${CERT_DAYS:-825}
      CERT_LOCALITY: ${CERT_LOCALITY:-Local}
      CERT_ORGANIZATION: ${CERT_ORGANIZATION:-Local Rocket.Chat}
      CERT_ORGANIZATIONAL_UNIT: ${CERT_ORGANIZATIONAL_UNIT:-IT}
      CERT_STATE: ${CERT_STATE:-Local}
    volumes:
      - ./certs:/certs
      - ./scripts/generate-self-signed-cert.sh:/usr/local/bin/generate-self-signed-cert.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/generate-self-signed-cert.sh

  rocketchat:
    image: ${ROCKETCHAT_IMAGE:?Set ROCKETCHAT_IMAGE in deploy/offline/.env}
    restart: unless-stopped
    depends_on:
      - mongo
    expose:
      - '3000'
    environment:
      DEPLOY_METHOD: docker
      HOME: /tmp
      HTTP_FORWARDED_COUNT: 1
      MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      PORT: 3000
      RC_CLOUD_DISABLED: 'true'
      RC_DISABLE_STATISTICS_REPORTING: 'true'
      ROOT_URL: https://${ROCKETCHAT_DOMAIN}
      Accounts_AvatarStorePath: /app/uploads
      MAIL_URL: ${MAIL_URL:-}
      OVERWRITE_INTERNAL_MARKETPLACE_URL: https://marketplace.invalid
      OVERWRITE_SETTING_Allow_Invalid_SelfSigned_Certs: 'true'
      OVERWRITE_SETTING_Allow_Marketing_Emails: 'false'
      OVERWRITE_SETTING_NPS_survey_enabled: 'false'
      OVERWRITE_SETTING_Push_enable: 'false'
      OVERWRITE_SETTING_Push_enable_gateway: 'false'
      OVERWRITE_SETTING_Register_Server: 'false'
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      OVERWRITE_SETTING_Site_Url: https://${ROCKETCHAT_DOMAIN}
      OVERWRITE_SETTING_Statistics_reporting: 'false'
      OVERWRITE_SETTING_Update_EnableChecker: 'false'
    extra_hosts:
      - billing.rocket.chat:127.0.0.1
      - cloud.rocket.chat:127.0.0.1
      - collector.rocket.chat:127.0.0.1
      - gateway.rocket.chat:127.0.0.1
      - marketplace.rocket.chat:127.0.0.1
      - nps.rocket.chat:127.0.0.1
      - oauth-proxy.rocket.chat:127.0.0.1
      - omni-gateway.rocket.chat:127.0.0.1
      - releases.rocket.chat:127.0.0.1
    volumes:
      - rocketchat-uploads:/app/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - rocketchat
    environment:
      ALLOW_SUBNET_1: ${ALLOW_SUBNET_1}
      ALLOW_SUBNET_2: ${ALLOW_SUBNET_2}
      ROCKETCHAT_DOMAIN: ${ROCKETCHAT_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    command:
      - /bin/sh
      - -c
      - envsubst '$${ROCKETCHAT_DOMAIN} $${ALLOW_SUBNET_1} $${ALLOW_SUBNET_2}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  mongo:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-8.0}-ubi8
    restart: unless-stopped
    environment:
      MONGODB_INITIAL_PRIMARY_HOST: mongo
      MONGODB_PORT_NUMBER: 27017
      MONGODB_REPLICA_SET_NAME: rs0
    entrypoint: |
      bash -c
        "mongod --replSet $$MONGODB_REPLICA_SET_NAME --bind_ip_all --dbpath /data/db &
          sleep 2;
          until mongosh --eval \"db.adminCommand('ping')\"; do
            echo '=====> Waiting for Mongo...';
            sleep 1;
          done;
          echo \"=====> Initiating ReplSet $$MONGODB_REPLICA_SET_NAME at $$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER...\";
          mongosh --eval \"rs.initiate({_id: '$$MONGODB_REPLICA_SET_NAME', members: [{ _id: 0, host: '$$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER' }]})\";
          echo '=====> Initiating ReplSet done...';
        wait"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  rocketchat-uploads:
